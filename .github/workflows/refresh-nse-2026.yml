name: Refresh NSE 2026 data

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-daily-2026
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Build 2026 daily CSVs
        run: python backend/nse_daily.py --year 2026 --out ./output --frontend-dir ./frontend/public/data --delay 0.25

      - name: Commit preview files for the UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/manifest.json frontend/public/data/nse_daily_2026_latest.csv
          if git diff --staged --quiet; then
            echo "No preview file changes"
          else
            git commit -m "Update NSE 2026 preview data"
            git push
          fi

      - name: Publish CSV release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=nse-daily-2026
          FILES=(output/manifest.json output/nse_daily_2026.csv output/nse_daily_2026_latest.csv)
          for f in output/nse_daily_2026_[0-9][0-9].csv; do
            [ -f "$f" ] && FILES+=("$f")
          done
          NOTES="All NSE EQ daily bars for 2026 (through the latest trading day). Generated by GitHub Actions."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "NSE daily data 2026" --notes "$NOTES"
          fi
